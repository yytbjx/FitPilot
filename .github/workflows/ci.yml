name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          uv sync --extra dev
      - name: Ruff lint (fatal errors only)
        working-directory: ${{ github.workspace }}
        run: |
          uvx ruff check backend/app backend/main.py main.py migrations --select E9,F63,F7,F82
      - name: Unit tests (no external services)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          NO_PROXY: 127.0.0.1,localhost
        run: |
          uv run python -m pytest -q tests/
      - name: Offline eval gates
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          NO_PROXY: 127.0.0.1,localhost
        run: |
          uv run python main.py eval-gate --out ../evals/reports/ci_gate.json
