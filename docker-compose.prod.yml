# FitPilot 交付环境 Compose（全容器）

# 阶段后期使用：后端/前端与基础设施一起交付；开发期优先 docker-compose.dev.yml

# 必须的环境变量（无默认值，缺失即报错启动失败）：
#   POSTGRES_PASSWORD            Postgres 超级用户密码（同时用于 worker 的 DATABASE_URL 拼接）
#   GF_SECURITY_ADMIN_PASSWORD   Grafana 管理员密码
# 在仓库根目录创建生产环境文件（参考 .env.example，勿提交真实密钥），
# 通过 `docker compose --env-file <file> -f docker-compose.prod.yml up` 注入，
# 或在 shell 中 export 后运行。backend/worker 的其余密钥经 env_file: .env 注入。



services:

  postgres:

    image: postgres:16-alpine

    environment:

      POSTGRES_USER: fitpilot

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      POSTGRES_DB: fitpilot

    volumes:

      - fitpilot_pg_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U fitpilot -d fitpilot"]

      interval: 5s

      timeout: 5s

      retries: 10



  redis:

    image: redis:7-alpine

    volumes:

      - fitpilot_redis_data:/data



  qdrant:

    image: qdrant/qdrant:latest

    ports:

      - "6333:6333"

      - "6334:6334"

    volumes:

      - fitpilot_qdrant_data:/qdrant/storage



  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    env_file:

      - .env

    environment:

      POSTGRES_HOST: postgres

      REDIS_URL: redis://redis:6379/0

      QDRANT_URL: http://qdrant:6333

      OLLAMA_BASE_URL: http://host.docker.internal:11434

      AGENT_USE_WORKER: "true"

    ports:

      - "8000:8000"

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_started

      qdrant:

        condition: service_started

    extra_hosts:

      - "host.docker.internal:host-gateway"



  worker:

    build:

      context: ./backend

      dockerfile: Dockerfile

    command: ["python", "-m", "app.worker.agent_runner"]

    env_file:

      - .env

    environment:

      REDIS_URL: redis://redis:6379/0

      DATABASE_URL: postgresql+asyncpg://fitpilot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/fitpilot

      QDRANT_URL: http://qdrant:6333

      OLLAMA_BASE_URL: http://host.docker.internal:11434

      AGENT_USE_WORKER: "true"

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_started

    extra_hosts:

      - "host.docker.internal:host-gateway"



  prometheus:

    image: prom/prometheus:v2.54.0

    volumes:

      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:

      - "9090:9090"

    depends_on:

      - backend



  grafana:

    image: grafana/grafana:11.2.0

    ports:

      - "3000:3000"

    environment:

      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}

    depends_on:

      - prometheus



volumes:

  fitpilot_pg_data:

  fitpilot_redis_data:

  fitpilot_qdrant_data:

