# FitPilot 评估配置（唯一权威；JSON 版已删除）
# 修改后无需重启服务；`fitpilot eval` / `eval-all` / `eval-gate` 每次加载。
#
# 评测集规模（与 suites 路径配合）：
#   --suite-set large  → evals/large/*.json     （大评测总集，默认）
#   --suite-set small  → evals/fewshot/*.json   （小评测总集 / CI 建议）
# 详见 evals/README.md

modules:
  parsing:
    enabled: true
    description: "文档解析成功率"
  retrieval:
    enabled: true
    description: "检索质量：Hit@K / MRR / nDCG / citation / latency（在线，需 Qdrant+模型）"
  retrieval_offline:
    enabled: true
    description: "离线确定性检索门禁（fixture 语料 + 哈希向量 + 真实 BM25/RRF/Gate）"
  no_answer:
    enabled: true
    description: "拒答 Recall / Precision（在线）"
  no_answer_offline:
    enabled: true
    description: "离线确定性拒答门禁"
  generation:
    enabled: true
    description: "引用精度 / 检索端到端"
  generation_online:
    enabled: false
    description: "LLM-as-judge（需 eval-all --online）"
  agent:
    enabled: true
    description: "意图准确率 / Macro-F1"
  plan:
    enabled: true
    description: "训练计划硬约束"
  meal:
    enabled: true
    description: "食谱宏量误差 / 忌口"
  safety:
    enabled: true
    description: "风险识别 / 周联合调整"
  context_kv:
    enabled: true
    description: "长上下文占用减少 / Recall@Budget / LCP / 三层路由 / DAG 编排（离线）"

suites:
  parsing: "evals/large/parsing_cases.json"
  retrieval: "evals/large/golden_rag.json"
  retrieval_offline: "evals/large/golden_rag_offline.json"
  no_answer: "evals/large/no_answer_cases.json"
  no_answer_offline: "evals/large/golden_rag_offline.json"
  generation: "evals/large/generation_cases.json"
  generation_online: "evals/large/generation_online_cases.json"
  agent: "evals/large/agent_routing_cases.json"
  plan: "evals/large/plan_cases.json"
  meal: "evals/large/meal_cases.json"
  safety: "evals/large/safety_cases.json"
  context_kv: "evals/large/context_kv_cases.json"

parameters:
  dataset_path: "evals/large/golden_rag.json"
  dataset_limit: null
  top_k_list: [1, 3, 5]
  top_k: 4
  output_dir: "evals/reports"
  offline_fixture_dir: "evals/rag_fixture"

thresholds:
  retrieval:
    # 迭代 3 收紧：hit_rate 0.5→0.7，mrr 0→0.3；严格口径（context 兜底命中单独计数）
    hit_rate: 0.7
    mrr: 0.3
    # Precision@K / TermRecall@K：默认 0=不作为硬门禁（观察目标约 precision@5≥0.70 / term_recall@5≥0.80）
    precision_at_5: 0.0
    term_recall_at_5: 0.0
    # 锚点子集观察（suite v4 清理后看基线；暂不硬 fail）
    # anchor_doc_at_5: 0.0
    # anchor_chunk_at_5: 0.0
  retrieval_offline:
    # 离线确定性门禁实测：hit_rate=1.0 / mrr≈0.96（fixture 语料，阈值留有余量）
    hit_rate: 0.7
    mrr: 0.3
    precision_at_5: 0.0
    term_recall_at_5: 0.0
    # 观察目标同 online：precision@5≥0.70 / term_recall@5≥0.80（默认 0 不 fail CI）
  no_answer_offline:
    # 离线实测 recall=1.0 / precision=1.0
    min_no_answer_recall: 0.7
    min_no_answer_precision: 0.6
  agent:
    min_accuracy: 0.85
    min_macro_f1: 0.75
  meal:
    max_kcal_error_pct: 0.25
    max_protein_error_pct: 0.25
    min_pass_rate: 0.75
  parsing:
    min_pass_rate: 0.85
  plan:
    min_pass_rate: 0.85
  safety:
    min_pass_rate: 0.85
  generation:
    min_pass_rate: 0.75
  no_answer:
    min_no_answer_recall: 0.7
    min_no_answer_precision: 0.6
  context_kv:
    min_reduction: 0.1
    min_recall_at_budget: 0.6
    min_lcp: 0.9
    min_route_accuracy: 0.8
    min_orchestrator_pass: 0.75
