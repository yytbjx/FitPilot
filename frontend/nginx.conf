# FitPilot 前端 nginx 配置：SPA 静态托管 + /api 反向代理到后端
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # /api/* → backend:8000/*（剥离 /api 前缀，与 Vite dev proxy 行为一致）
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式响应需要逐行透传 request_id 等头
        proxy_pass_header X-Request-ID;

        # ---- SSE（/agent/tasks/{id}/stream）必备 ----
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # 不缓冲，事件即时下发
        proxy_cache off;
        proxy_read_timeout 600s;      # Agent 任务长连接
        proxy_send_timeout 600s;
    }

    # 带指纹的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback：前端路由全部回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
